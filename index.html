<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CookUp</title>
<meta name="description" content="A quiet production session companion. Clock, session timer, BPM calculator, tap tempo, water and break reminders — so you never have to leave the DAW.">
<meta name="theme-color" content="#0E1014">
<meta name="color-scheme" content="dark">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preload" href="./fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CookUp">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="./styles/style.css">
</head>
<body>

<div class="ambient" aria-hidden="true"></div>

<noscript>
  <p style="padding:44px;color:#8E939B;font-family:sans-serif;max-width:36em">
    CookUp needs JavaScript to keep time. Enable it and reload.
  </p>
</noscript>

<main id="app">

  <!-- ─────────────────────────────  HOME  ───────────────────────────── -->
  <section id="screen-home" class="screen screen-home">
    <header class="home-header">
      <div class="brand">
        <svg class="brand-mark" viewBox="40 40 432 432" aria-hidden="true">
          <g stroke="currentColor" stroke-linecap="round" fill="none" stroke-width="22" opacity=".45">
            <path d="M186 176c0-30 30-34 30-64s-24-30-24-52"/>
            <path d="M256 176c0-34 34-38 34-70s-26-32-26-56"/>
            <path d="M326 176c0-30 30-34 30-64s-24-30-24-52"/>
          </g>
          <rect x="76" y="212" width="360" height="52" rx="26" fill="currentColor"/>
          <path d="M112 286h288v52c0 57-46 103-103 103h-82c-57 0-103-46-103-103v-52z" fill="currentColor"/>
        </svg>
        <span class="brand-name">CookUp</span>
      </div>
      <button id="btn-new" class="icon-btn icon-btn-accent" aria-label="New session" title="New session">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <p class="home-tagline">Sessions</p>

    <div id="session-list" class="session-list"></div>

    <div id="empty-state" class="empty" hidden>
      <p class="empty-title">Nothing cooking yet</p>
      <p class="empty-sub">Press <span class="kbd">+</span> to start a session.</p>
    </div>

    <footer class="home-footer">
      <span id="storage-note">Everything stays on this device.</span>
    </footer>
  </section>

  <!-- ────────────────────────────  SESSION  ──────────────────────────── -->
  <section id="screen-session" class="screen screen-session" hidden>

    <header class="session-header">
      <button id="btn-back" class="icon-btn" aria-label="Back to sessions" title="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>

      <div class="session-title">
        <h1 id="session-name">Session</h1>
        <span id="session-status" class="status status-running">
          <i class="dot" aria-hidden="true"></i><span class="status-text">Running</span>
        </span>
      </div>

      <div class="session-actions">
        <button id="btn-toggle" class="btn btn-ghost">Pause</button>
        <button id="btn-end" class="btn btn-quiet">End Session</button>
      </div>
    </header>

    <div class="grid">

      <!-- Hero: clock + elapsed -->
      <article class="card hero" style="grid-area:hero">
        <button id="clock-block" class="hero-block hero-clock" title="Switch 12 / 24 hour">
          <span id="clock-time" class="hero-value clock">--:--</span>
          <span id="clock-date" class="hero-label"></span>
        </button>
        <div class="hero-rule" aria-hidden="true"></div>
        <div class="hero-block">
          <span id="elapsed" class="hero-value">0m</span>
          <span id="elapsed-label" class="hero-label">Elapsed</span>
        </div>
      </article>

      <!-- BPM calculator -->
      <article class="card bpm" style="grid-area:bpm">
        <div class="card-head">
          <h2 class="card-title">BPM</h2>
        </div>
        <div class="bpm-input-row">
          <input id="bpm-input" class="bpm-input" type="text" inputmode="decimal"
                 autocomplete="off" spellcheck="false" value="120" aria-label="Tempo in beats per minute">
          <span class="bpm-unit">bpm</span>
        </div>
        <dl id="bpm-list" class="bpm-list"></dl>
      </article>

      <!-- Tap tempo -->
      <article class="card tap" style="grid-area:tap">
        <div class="card-head">
          <h2 class="card-title">Tap Tempo</h2>
          <span id="tap-readout" class="card-meta">—</span>
        </div>
        <button id="tap-btn" class="tap-btn">
          <span class="tap-btn-label">TAP</span>
          <span id="tap-count" class="tap-btn-sub">tap in time</span>
        </button>
      </article>

      <!-- Water -->
      <article class="card water" style="grid-area:water">
        <div class="card-head">
          <h2 class="card-title">Water</h2>
        </div>
        <button id="water-btn" class="water-btn" aria-label="Add a glass of water. Hold to reset.">
          <span class="water-row">
            <span class="water-icon" aria-hidden="true">💧</span>
            <span id="water-count" class="water-count">0</span>
          </span>
          <span class="card-hint">Hold to reset</span>
        </button>
      </article>

      <!-- Break reminder -->
      <article class="card breaks" style="grid-area:break">
        <div class="card-head">
          <h2 class="card-title">Break</h2>
          <span id="break-next" class="card-meta">—</span>
        </div>
        <div id="break-seg" class="seg" role="group" aria-label="Break reminder interval">
          <button class="seg-btn" data-min="30" aria-label="Every 30 minutes">30<span class="seg-unit">m</span></button>
          <button class="seg-btn" data-min="45" aria-label="Every 45 minutes">45<span class="seg-unit">m</span></button>
          <button class="seg-btn" data-min="60" aria-label="Every 60 minutes">60<span class="seg-unit">m</span></button>
          <button class="seg-btn" data-min="90" aria-label="Every 90 minutes">90<span class="seg-unit">m</span></button>
        </div>
      </article>

    </div>
  </section>

</main>

<div id="modal-layer"></div>
<div id="toast-layer" class="toast-layer" role="status" aria-live="polite"></div>

<script type="module" src="./scripts/ui.js"></script>
</body>
</html>
